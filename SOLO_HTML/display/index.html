<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Propiedad display en CSS</title>

    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<h1>Ejemplos de display en CSS</h1>

<!-- ===================== -->
<!-- display: block -->
<h2>display: block</h2>

<div class="caja block">Bloque 1</div>
<div class="caja block">Bloque 2</div>

<!-- ===================== -->
<!-- display: inline -->
<h2>display: inline</h2>

<span class="caja inline">Inline 1</span>
<span class="caja inline">Inline 2</span>
<span class="caja inline">Inline 3</span>

<!-- ===================== -->
<!-- display: inline-block -->
<h2>display: inline-block</h2>

<div class="caja inline-block">Inline-Block 1</div>
<div class="caja inline-block">Inline-Block 2</div>
<div class="caja inline-block">Inline-Block 3</div>

<!-- ===================== -->
<!-- display: none -->
<h2>display: none</h2>

<div class="caja none">No se muestra</div>
<p>Este texto aparece porque la caja anterior está oculta.</p>

</body>
</html>
