<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flexbox - align-items</title>

    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<h1>Propiedad align-items</h1>

<!-- ============================== -->
<!-- align-items: stretch -->
<h2>align-items: stretch (por defecto)</h2>
<div class="contenedor stretch">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
</div>

<!-- ============================== -->
<!-- align-items: flex-start -->
<h2>align-items: flex-start</h2>
<div class="contenedor flex-start">
    <div class="item chico">1</div>
    <div class="item grande">2</div>
    <div class="item chico">3</div>
</div>

<!-- ============================== -->
<!-- align-items: center -->
<h2>align-items: center</h2>
<div class="contenedor center">
    <div class="item chico">1</div>
    <div class="item grande">2</div>
    <div class="item chico">3</div>
</div>

<!-- ============================== -->
<!-- align-items: flex-end -->
<h2>align-items: flex-end</h2>
<div class="contenedor flex-end">
    <div class="item chico">1</div>
    <div class="item grande">2</div>
    <div class="item chico">3</div>
</div>

</body>
</html>
