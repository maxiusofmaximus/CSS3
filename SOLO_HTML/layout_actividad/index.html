<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="css/css.css">
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL (GRID) -->
    <div class="grid-container">

        <!-- ENCABEZADO -->
        <header class="header">
            <h1>Perfil del Usuario</h1>
        </header>

        <!-- PERFIL -->
        <section class="perfil">
            <!-- CONTENEDOR FLEX -->
            <div class="info">
                <img src="https://via.placeholder.com/120" alt="Foto de perfil">
                <div class="datos">
                    <h2>Juan Pérez</h2>
                    <p>Docente de Tecnología</p>
                    <p>Apasionado por el desarrollo web</p>
                </div>
            </div>
        </section>

        <!-- PUBLICACIONES -->
        <section class="publicaciones">
            <!-- CONTENEDOR FLEX -->
            <div class="posts">
                <div class="post">Publicación 1</div>
                <div class="post">Publicación 2</div>
                <div class="post">Publicación 3</div>
            </div>
        </section>

        <!-- PIE DE PÁGINA -->
        <footer class="footer">
            <p>© 2026 - Perfil de Usuario</p>
        </footer>

    </div>

</body>
</html>
