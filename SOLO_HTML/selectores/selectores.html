<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selectores CSS3</title>
    
    <!-- comentada para probar estilo css en la pagina o aparte

    <link rel="stylesheet" href="estilos.css">-->
    
</head>
<body>


    <!--codigo css-->

    <style>
        /* Selector de etiqueta */
        p {
            color: black;
            font-size: 16px;
        }

        /* Selector de clase */
        .destacado {
            color: blue;
            font-weight: bold;
        }

        /* Selector de ID */
        #especial {
            color: red;
        }

        /* Selector descendente */
        div p {
            color: green;
        }

        /* Selector de elemento */
        a {
            color: purple;
            text-decoration: none;
        }

    </style>

    <!--codigo html-->

    <h1>Ejemplo de selectores CSS3</h1>

    <p>Este es un párrafo normal.</p>

    <p class="destacado">Este párrafo usa selector de clase.</p>

    <p id="especial">Este párrafo usa selector de ID.</p>

    <div>
        <p>Párrafo dentro de un div (selector descendente).</p>
    </div>

    <a href="#">Enlace de ejemplo</a>

</body>
</html>
